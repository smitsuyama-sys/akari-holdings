[build]
  publish = "."
  command = "node scripts/build-sitemap.mjs"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["assets/shindan-core.mjs"]

# 運用用ファイルや開発用ファイルは公開しない
[[redirects]]
  from = "/ops/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wallpaper/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# 個別の診断レポートは検索エンジンに載せない
[[headers]]
  for = "/report.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
